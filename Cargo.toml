[package]
name = "learn_wgpu"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.99"
env_logger = "0.11.8"
log = "0.4.28"
pollster = "0.4.0"
wgpu = "26.0.1"
winit = "0.30.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wgpu = { version = "26.0.1", features = ["webgl"]}
wasm-bindgen = "0.2.101"
wasm-bindgen-futures = "0.4.51"
web-sys = { version = "0.3.78", features = [
        "Document",
        "Window",
        "Element",
]}
